schema_version: '1.0'
kind: connection-preset
id: openrouter
label: Openrouter
provider:
  driver: openrouter
  credential_ref: env:OPENROUTER_API_KEY
  model_selection: discover
  base_url: null
harness:
  adapter: builtin
  requires_installed_adapter: true
default_execution:
  workers: 1
  allow_write_tools: false
  max_cost_usd: 0
  network_permission: ask
notes: model routing needs data residency approval

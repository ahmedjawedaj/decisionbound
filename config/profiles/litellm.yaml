schema_version: '1.0'
kind: connection-preset
id: litellm
label: Litellm
provider:
  driver: litellm-proxy
  credential_ref: env:LITELLM_API_KEY
  model_selection: discover
  base_url: null
harness:
  adapter: builtin
  requires_installed_adapter: true
default_execution:
  workers: 1
  allow_write_tools: false
  max_cost_usd: 0
  network_permission: ask
notes: endpoint and team scopes required

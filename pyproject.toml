[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "decisionbound"
version = "0.13.0a1"
description = "Evidence-grounded context and decision transfer for engineering agents"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{name = "Ahmed Jawed"}, {name = "DecisionBound contributors"}]
keywords = ["agents", "orchestration", "context-engineering", "verification", "mcp", "decision-transfer"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["typer>=0.9", "PyYAML>=6"]

[project.optional-dependencies]
web = ["fastapi>=0.100", "uvicorn>=0.20"]
mcp = ["mcp>=2.0,<3"]
docs = ["mistune>=3.0"]
test = ["pytest>=7", "httpx>=0.25", "pytest-cov>=4"]
release = ["cryptography>=43", "packaging>=24"]

[project.urls]
Homepage = "https://ahmedjawedaj.github.io/decisionbound/"
Documentation = "https://ahmedjawedaj.github.io/decisionbound/"
Repository = "https://github.com/ahmedjawedaj/decisionbound"
Issues = "https://github.com/ahmedjawedaj/decisionbound/issues"
Changelog = "https://github.com/ahmedjawedaj/decisionbound/blob/main/CHANGELOG.md"

[project.scripts]
dbound = "decisionbound.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests/unit", "tests/integration", "tests/security", "tests/contract"]
addopts = "-ra"

[tool.coverage.run]
source = ["decisionbound"]

[tool.coverage.report]
show_missing = true

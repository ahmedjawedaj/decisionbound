name: Publish reviewed DecisionBound documentation to GitHub Pages
on:
  workflow_run:
    workflows: ["Release readiness"]
    types: [completed]
    branches: [main]
permissions:
  contents: read
concurrency:
  group: documentation-pages
  cancel-in-progress: true
jobs:
  build:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install documentation and runtime dependencies
        run: python -m pip install -e '.[docs,web]'
      - uses: actions/configure-pages@v5
      - name: Generate API documentation
        run: python scripts/generate_api_docs.py
      - name: Generate static documentation and concept demo
        run: python scripts/build_site.py
      - name: Validate relative links
        run: |
          python scripts/verify_docs.py
          python scripts/check_docs.py
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - uses: actions/deploy-pages@v5
        id: deployment
# Only a successful push validation on this repository's main can deploy.
# The deployment builds the exact validated SHA, not an unverified later HEAD.
# Static documentation only: no agent runtime or local control API is hosted.
